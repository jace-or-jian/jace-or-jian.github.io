<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title"><title id="title">THz bandwidth and directional gain: opportunities and constraints</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#224b8d"/></marker></defs><rect width="900" height="650" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="35" y="43" font-size="26" fill="#224b8d" font-weight="650" text-anchor="start">THz: the opportunity and the link constraint</text><rect x="35" y="72" width="390" height="130" rx="10" fill="#f6f8fb" stroke="#dce3ed"/><text x="57" y="108" font-size="18" fill="#224b8d" font-weight="650" text-anchor="start">LARGE BANDWIDTH</text><text x="57" y="142" font-size="18" fill="#596267" font-weight="400" text-anchor="start">High rate at moderate bits/s/Hz</text><text x="57" y="169" font-size="18" fill="#596267" font-weight="400" text-anchor="start">Fine range resolution</text><rect x="475" y="72" width="390" height="130" rx="10" fill="#f6f8fb" stroke="#dce3ed"/><text x="497" y="108" font-size="18" fill="#224b8d" font-weight="650" text-anchor="start">SHORT WAVELENGTH</text><text x="497" y="142" font-size="18" fill="#596267" font-weight="400" text-anchor="start">Many elements in a compact aperture</text><text x="497" y="169" font-size="18" fill="#596267" font-weight="400" text-anchor="start">High directional gain</text><path d="M230 204 L230 240" fill="none" stroke="#224b8d" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 204 L670 240" fill="none" stroke="#224b8d" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="252" width="390" height="132" rx="10" fill="#f6f8fb" stroke="#dce3ed"/><text x="57" y="287" font-size="18" fill="#224b8d" font-weight="650" text-anchor="start">THE COST</text><text x="57" y="321" font-size="18" fill="#596267" font-weight="400" text-anchor="start">More integrated noise (kTB)</text><text x="57" y="348" font-size="18" fill="#596267" font-weight="400" text-anchor="start">Wideband hardware demands</text><rect x="475" y="252" width="390" height="132" rx="10" fill="#f6f8fb" stroke="#dce3ed"/><text x="497" y="287" font-size="18" fill="#224b8d" font-weight="650" text-anchor="start">THE COST</text><text x="497" y="321" font-size="18" fill="#596267" font-weight="400" text-anchor="start">Narrow beams need precise alignment</text><text x="497" y="348" font-size="18" fill="#596267" font-weight="400" text-anchor="start">Blocked paths need an alternative</text><path d="M230 386 L230 448" fill="none" stroke="#224b8d" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 386 L670 448" fill="none" stroke="#224b8d" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="460" width="390" height="148" rx="10" fill="#eef3fa" stroke="#dce3ed"/><text x="57" y="495" font-size="19" fill="#224b8d" font-weight="650" text-anchor="start">BUILD A VIABLE LINK</text><text x="57" y="530" font-size="17" fill="#596267" font-weight="400" text-anchor="start">Close the power and noise budget.</text><text x="57" y="557" font-size="17" fill="#596267" font-weight="400" text-anchor="start">Choose a usable transmission band.</text><text x="57" y="584" font-size="17" fill="#596267" font-weight="400" text-anchor="start">Match rate to received SNR.</text><rect x="475" y="460" width="390" height="148" rx="10" fill="#eef3fa" stroke="#dce3ed"/><text x="497" y="495" font-size="19" fill="#224b8d" font-weight="650" text-anchor="start">KEEP IT CONNECTED</text><text x="497" y="530" font-size="17" fill="#596267" font-weight="400" text-anchor="start">Sense motion → predict → steer.</text><text x="497" y="557" font-size="17" fill="#596267" font-weight="400" text-anchor="start">Predict blockage → prepare a path.</text><text x="497" y="584" font-size="17" fill="#596267" font-weight="400" text-anchor="start">Account for uncertainty and delay.</text></g></svg>