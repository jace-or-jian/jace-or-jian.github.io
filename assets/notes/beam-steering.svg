<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title"><title id="title">Equal phases and opposite phase progressions steer an antenna array</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#224b8d"/></marker></defs><rect width="900" height="460" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="35" y="43" font-size="26" fill="#224b8d" font-weight="650" text-anchor="start">Steering is a matter of relative phase</text><rect x="25" y="74" width="280" height="310" rx="10" fill="#f6f8fb" stroke="#dce3ed"/><text x="165" y="108" font-size="19" fill="#224b8d" font-weight="650" text-anchor="middle">Equal phase</text><path d="M140 255 L147 143 L183 143 L190 255 Z" fill="#e5edf8"/><path d="M165 248 L165 145" fill="none" stroke="#224b8d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="70" cy="270" r="7" fill="#224b8d"/><text x="70" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">0°</text><circle cx="132" cy="270" r="7" fill="#224b8d"/><text x="132" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">0°</text><circle cx="194" cy="270" r="7" fill="#224b8d"/><text x="194" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">0°</text><circle cx="256" cy="270" r="7" fill="#224b8d"/><text x="256" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">0°</text><text x="165" y="351" font-size="18" fill="#3f4549" font-weight="400" text-anchor="middle">Broadside</text><rect x="320" y="74" width="280" height="310" rx="10" fill="#f6f8fb" stroke="#dce3ed"/><text x="460" y="108" font-size="19" fill="#224b8d" font-weight="650" text-anchor="middle">Phase progression</text><path d="M435 255 L382 143 L418 143 L485 255 Z" fill="#e5edf8"/><path d="M460 248 L400 145" fill="none" stroke="#224b8d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="365" cy="270" r="7" fill="#224b8d"/><text x="365" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">0°</text><circle cx="427" cy="270" r="7" fill="#224b8d"/><text x="427" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">45°</text><circle cx="489" cy="270" r="7" fill="#224b8d"/><text x="489" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">90°</text><circle cx="551" cy="270" r="7" fill="#224b8d"/><text x="551" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">135°</text><text x="460" y="351" font-size="18" fill="#3f4549" font-weight="400" text-anchor="middle">Steer one way</text><rect x="615" y="74" width="280" height="310" rx="10" fill="#f6f8fb" stroke="#dce3ed"/><text x="755" y="108" font-size="19" fill="#224b8d" font-weight="650" text-anchor="middle">Opposite progression</text><path d="M730 255 L797 143 L833 143 L780 255 Z" fill="#e5edf8"/><path d="M755 248 L815 145" fill="none" stroke="#224b8d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="660" cy="270" r="7" fill="#224b8d"/><text x="660" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">0°</text><circle cx="722" cy="270" r="7" fill="#224b8d"/><text x="722" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">−45°</text><circle cx="784" cy="270" r="7" fill="#224b8d"/><text x="784" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">−90°</text><circle cx="846" cy="270" r="7" fill="#224b8d"/><text x="846" y="310" font-size="15" fill="#596267" font-weight="400" text-anchor="middle">−135°</text><text x="755" y="351" font-size="18" fill="#3f4549" font-weight="400" text-anchor="middle">Steer the other way</text><text x="450" y="421" font-size="17" fill="#596267" font-weight="400" text-anchor="middle">Conceptual directions only. Phase sign depends on convention.</text></g></svg>